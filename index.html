let state='menu';            // menu | play | pause | over | records

  {id:'classic',name:'Классика',desc:'3 жизни · лови Нину, обходи фальшивые монеты'},

function saveAll(){
  try{
    localStorage.setItem('monetochka_records',JSON.stringify(records));
    localStorage.setItem('monetochka_mode',String(modeIdx));
    localStorage.setItem('monetochka_sound',soundOn?'1':'0');
  }catch(e){}
}

/* ---------- звук ---------- */
let AC=null,master=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=0.8;master.connect(AC.destination);
  }catch(e){AC=null;}
}
function tone(f,d,type,v,delay,slideTo){
  if(!AC||!soundOn)return;
  const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(f,t0);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+d);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(v||0.15,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+d+0.05);
}
const PENT=[0,2,4,7,9];
function noteFreq(k){return 220*Math.pow(2,(12*Math.floor(k/5)+PENT[((k%5)+5)%5])/12);}
let musicTimer=null,mStep=0;
function musicStart(){
  if(musicTimer)return;
  const pat=[0,2,4,2,5,4,2,1];

    if(!AC||!soundOn||state!=='play'||!G||G.countdown>0)return;
    tone(noteFreq(pat[mStep%8]+3)/2,0.34,'triangle',0.045);
    if(mStep%4===0)tone(120,0.22,'sine',0.14,0,55);
    if(mStep%2===1)tone(8000,0.03,'square',0.012);
    mStep++;
  },250);
}

/* ---------- рисовальные помощники ---------- */
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function glow(x,y,r,col,a){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));
  ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
}
function ell(x,y,rx,ry,fill,rot){
  ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,TAU);ctx.fillStyle=fill;ctx.fill();
}
function sparkle4(x,y,r,rot){
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const a=rot+i*Math.PI/4,rad=(i%2===0)?r:r*0.28;
    const px=x+Math.cos(a)*rad,py=y+Math.sin(a)*rad;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();
}
function drawHeart(x,y,r){
  ctx.beginPath();ctx.moveTo(x,y+r*0.9);
  ctx.bezierCurveTo(x-r*1.6,y-r*0.1,x-r*0.7,y-r*1.1,x,y-r*0.4);
  ctx.bezierCurveTo(x+r*0.7,y-r*1.1,x+r*1.6,y-r*0.1,x,y+r*0.9);
  ctx.closePath();
}
function flower(x,y,r,c){
  ctx.fillStyle=c;
  for(let i=0;i<5;i++){
    const a=i*TAU/5;
    ctx.beginPath();ctx.arc(x+Math.cos(a)*r*0.8,y+Math.sin(a)*r*0.8,r*0.62,0,TAU);ctx.fill();
  }
  ctx.fillStyle='#e98a0c';ctx.beginPath();ctx.arc(x,y,r*0.45,0,TAU);ctx.fill();
}
function curl(x,y,r,dir,rot,col,lw){
  const cx=x-Math.cos(rot)*r,cy=y-Math.sin(rot)*r;
  ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();
  for(let a=0;a<=4.6;a+=0.25){
    const rad=r*(1-a/6.2),th=rot+dir*a;
    const px=cx+Math.cos(th)*rad,py=cy+Math.sin(th)*rad;
    if(a===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.stroke();
}

const parts=[],floats=[];
function spark(x,y,n,col){
  for(let i=0;i<n;i++){
    const a=rnd(0,TAU),v=rnd(40,180);
    parts.push({k:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:rnd(0.4,0.9),max:0.9,size:rnd(1.5,3.5),col:col||[255,220,110]});
  }
}
function note(x,y){
  parts.push({k:'note',x,y,vx:rnd(-18,18),vy:rnd(-55,-35),life:1.6,max:1.6,size:rnd(15,22),txt:Math.random()<0.5?'♪':'♫',ph:rnd(0,TAU),
    col:[[255,224,120],[120,255,240],[255,170,210]][Math.floor(rnd(0,3))]});
}
function star(x,y){parts.push({k:'star',x,y,vx:0,vy:-12,life:0.8,max:0.8,size:11,col:[255,246,190]});}
function floatText(x,y,txt,col,size){floats.push({x,y,txt,col:col||'#ffe27a',size:size||22,life:1,vy:-60});}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    if(p.k==='spark'){p.vy+=320*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
    else if(p.k==='note'){p.x+=(p.vx+Math.sin(tNow*3+p.ph)*20)*dt;p.y+=p.vy*dt;}
    else{p.y+=p.vy*dt;}
  }
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i];f.life-=dt*1.1;f.y+=f.vy*dt;
    if(f.life<=0)floats.splice(i,1);
  }
}
function drawParts(){
  ctx.save();
  for(const p of parts){
    const a=clamp(p.life/p.max,0,1);
    if(p.k==='spark'){
      ctx.globalCompositeOperation='lighter';ctx.fillStyle=rgba(p.col,a);
      ctx.beginPath();ctx.arc(p.x,p.y,p.size*a+0.5,0,TAU);ctx.fill();
    }else if(p.k==='star'){
      ctx.globalCompositeOperation='lighter';ctx.fillStyle=rgba(p.col,a);
      sparkle4(p.x,p.y,p.size*(0.6+0.6*(1-a)),tNow*2);ctx.fill();
    }else{
      ctx.globalCompositeOperation='source-over';ctx.globalAlpha=Math.min(1,a*1.6);
      ctx.fillStyle=rgba(p.col,1);ctx.shadowColor=rgba(p.col,0.9);ctx.shadowBlur=8;
      ctx.font='700 '+p.size+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(p.txt,p.x,p.y);ctx.shadowBlur=0;ctx.globalAlpha=1;
    }
  }
  ctx.restore();
  for(const f of floats){
    ctx.save();ctx.globalAlpha=clamp(f.life*1.4,0,1);
    ctx.font='900 '+f.size+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=4;ctx.strokeStyle='rgba(70,35,0,.85)';ctx.strokeText(f.txt,f.x,f.y);
    ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);ctx.restore();
  }
}

const HERO={x:0,y:0,s:1,init:false,lean:0,turn:0,raise:0,look:0,catch:0,mouth:0,
  act:null,actT:0,nextAct:2.2,lastAct:'',blinkT:2.5,blinkOn:0,winkT:4.5,winkOn:0,
  coin:null,keyX:60,keyTarget:60,keyPress:new Array(14).fill(0),leds:[0,0,0,0,0,0],ledT:0.6,
  noteIdx:0,noteT:0,synthA:1};
const SKIN='#ffdcc2',SKIN2='#f2b99b',HAIR='#f6dc96',HAIR2='#dcad5c';
const MX=-66; // стойка микрофона (локальные координаты)
const PLAY_NOTES=[3,5,7,5,9,7,10];
const PLAY_TIMES=[0.8,1.3,1.8,2.2,2.8,3.3,3.8];

function synthPos(){return {x:W*0.83,y:L.menuFeetY,s:L.heroS};}
function keysLocal(idx){
  const sp=synthPos();
  const sx=sp.x+(-65+(idx+0.5)*(130/14))*sp.s;
  return (sx-HERO.x)/HERO.s;
}
function updateHero(dt,t){
  const H0=HERO,menuish=(state==='menu'||state==='records');
  const k=Math.min(1,dt*4);
  if(menuish){
    H0.x+=(W*0.45-H0.x)*k;H0.y+=(L.menuFeetY-H0.y)*k;H0.s+=(L.heroS-H0.s)*k;
    H0.lean+=(0-H0.lean)*k;
  }else{
    H0.y+=(L.gameFeetY-H0.y)*k;H0.s+=(L.gameS-H0.s)*k;
  }
  H0.synthA+=((menuish?1:0)-H0.synthA)*Math.min(1,dt*5);
  // моргание / подмигивание
  H0.blinkT-=dt;if(H0.blinkT<0){H0.blinkT=rnd(2.2,4.5);H0.blinkOn=0.14;}
  if(H0.blinkOn>0)H0.blinkOn-=dt;
  H0.winkT-=dt;
  if(H0.winkT<0){
    H0.winkT=rnd(5,8.5);H0.winkOn=0.6;
    star(H0.x+(26)*H0.s,H0.y-(222)*H0.s);
  }
  if(H0.winkOn>0)H0.winkOn-=dt;
  // кнопки синтезатора
  H0.ledT-=dt;
  if(H0.ledT<0){H0.ledT=rnd(0.25,0.8);const i=Math.floor(rnd(0,6));H0.leds[i]=H0.leds[i]?0:1+Math.floor(rnd(0,3));}
  for(let i=0;i<14;i++)H0.keyPress[i]=Math.max(0,H0.keyPress[i]-dt*3);
  H0.catch=Math.max(0,H0.catch-dt*2.2);
  // действия
  let raiseT=0,turnT=0,lookT=0,mouthT=0,singW=0;
  H0.coin=null;
  if(menuish){
    if(!H0.act){
      H0.nextAct-=dt;
      if(H0.nextAct<=0){
        const opts=['toss','play','sing'].filter(a=>a!==H0.lastAct);
        H0.act=opts[Math.floor(Math.random()*opts.length)];H0.lastAct=H0.act;
        H0.actT=0;H0.noteIdx=0;H0.noteT=0;
        if(H0.act==='play')H0.keyTarget=keysLocal(4);
      }
    }else{
      H0.actT+=dt;
      const a=H0.act;
      if(a==='toss'){
        const dur=2.4,u=H0.actT/dur;
        let w;
        if(u<0.12)w=ease(u/0.12);else if(u<0.78)w=1;else w=1-ease((u-0.78)/0.2);
        raiseT=w;
        const fu=(u-0.12)/0.66;
        const hx=56,hy=-170;
        if(u<0.12){H0.coin={x:hx,y:hy-12,spin:0};}
        else if(fu<=1){
          const h=4*fu*(1-fu)*150;
          H0.coin={x:hx+Math.sin(fu*Math.PI)*8,y:hy-12-h,spin:fu*Math.PI*7};
          lookT=h/150;
        }else if(u<0.9){H0.coin={x:hx,y:hy-12,spin:0};}
        if(!H0.noteT&&u>0.8){H0.noteT=1;spark(H0.x+hx*H0.s,H0.y+(hy-12)*H0.s,14);H0.catch=0.8;tone(988,0.18,'sine',0.1);tone(1319,0.25,'sine',0.08,0.08);}
        if(H0.actT>=dur){H0.act=null;H0.nextAct=rnd(2.5,4.5);}
      }else if(a==='play'){
        const dur=4.6,u=H0.actT/dur;
        let w;
        if(u<0.12)w=ease(u/0.12);else if(u>0.88)w=1-ease((u-0.88)/0.12);else w=1;
        turnT=w;
        while(H0.noteIdx<PLAY_TIMES.length&&H0.actT>=PLAY_TIMES[H0.noteIdx]){
          const kk=PLAY_NOTES[H0.noteIdx];
          H0.keyTarget=keysLocal(kk);H0.keyPress[kk]=1;
          const li=Math.floor(rnd(0,6));H0.leds[li]=1+Math.floor(rnd(0,3));
          const f=noteFreq(kk);tone(f,0.5,'triangle',0.11);tone(f*2,0.35,'sine',0.04);
          const sp=synthPos();
          note(sp.x+(-65+(kk+0.5)*(130/14))*sp.s,sp.y-125*sp.s);
          H0.noteIdx++;
        }
        if(H0.actT>=dur){H0.act=null;H0.nextAct=rnd(2.5,4.5);}
      }else if(a==='sing'){
        const dur=3.4,u=H0.actT/dur;
        singW=(u<0.1)?ease(u/0.1):(u>0.9?1-ease((u-0.9)/0.1):1);
        mouthT=singW*clamp(0.55+0.45*Math.sin(H0.actT*10),0,1);
        H0.noteT-=dt;
        if(H0.noteT<=0){
          H0.noteT=0.42;
          note(H0.x+(MX+22)*H0.s,H0.y-195*H0.s);
          tone(noteFreq(Math.floor(rnd(5,11))),0.32,'sine',0.05);
        }
        if(H0.actT>=dur){H0.act=null;H0.nextAct=rnd(2.5,4.5);}
      }
    }
  }else{
    H0.act=null;
    if(H0.catch>0)raiseT=1;
  }
  if(H0.catch>0.2)mouthT=Math.max(mouthT,H0.catch);
  const kk=Math.min(1,dt*9);
  H0.raise+=(raiseT-H0.raise)*kk;
  H0.turn+=(turnT-H0.turn)*kk;
  H0.look+=(lookT-H0.look)*kk;
  H0.mouth+=(mouthT-H0.mouth)*Math.min(1,dt*14);
  H0.keyX+=(H0.keyTarget-H0.keyX)*Math.min(1,dt*10);
  H0.sing=singW;
}

  ctx.beginPath();ctx.arc(0,0,r*0.68,0,TAU);ctx.stroke();
  if(fake){
    ctx.strokeStyle='#ff5a6a';ctx.lineWidth=Math.max(1.5,r*0.2);ctx.lineCap='round';

  ctx.restore();

/* ---- юбка ---- */
function skirtPath(hw,hemY,ph,t,sw){
  const n=7;ctx.beginPath();ctx.moveTo(-22,-112);
  ctx.bezierCurveTo(-28,-100,-hw*0.8+sw*0.4,hemY-46,-hw+sw,hemY);
  for(let i=0;i<n;i++){
    const u0=i/n,u1=(i+1)/n;
    const x1=-hw+sw+2*hw*u1,xm=-hw+sw+2*hw*(u0+u1)/2;
    const y0=Math.sin(t*2.2+ph+i*1.3)*3,y1=Math.sin(t*2.2+ph+(i+1)*1.3)*3;
    ctx.quadraticCurveTo(xm,hemY+y0*0.5+9,x1,hemY+y1);
  }
  ctx.bezierCurveTo(hw*0.8+sw*0.4,hemY-46,28,-100,22,-112);
  ctx.closePath();
}
const FLC=['#ff7fa6','#fff6ee','#ff9a7a','#ffffff','#ffb3c8'];
function sleeve(sg,t){
  ctx.save();ctx.translate(sg*34,-166);ctx.rotate(sg*0.28);
  const g=ctx.createRadialGradient(-4*sg,-9,3,0,0,28);

  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,19,24,0,0,TAU);ctx.fill();

function drawHero(P,t,pulse){

  ctx.strokeStyle='rgba(255,236,170,.8)';ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(bx,by,15,Math.PI*1.1,Math.PI*1.8);ctx.stroke();

  eye(-11+tx,1,blink,false,gx,gy);
  eye(11+tx,1,Math.max(blink,winkV),winkV>0.6,gx,gy);

  ctx.strokeStyle='#e5a287';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(tx*0.8,9,2.6,0.2,Math.PI-0.2);ctx.stroke();
  // рот
  const mo=P.mouth,mxp=tx*0.7;

  }

function drawSynth(x,y,s,a,t,P){
  if(a<0.02)return;
  ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.scale(s,s);
  ctx.strokeStyle='#161e22';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-46,-56);ctx.lineTo(38,-2);ctx.moveTo(46,-56);ctx.lineTo(-38,-2);ctx.stroke();
  ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-50,-1);ctx.lineTo(-26,-1);ctx.moveTo(26,-1);ctx.lineTo(50,-1);ctx.stroke();
  // корпус
  rr(-67,-66,134,16,4);ctx.fillStyle='#a8141f';ctx.fill();
  rr(-66,-124,132,30,6);
  let g=ctx.createLinearGradient(0,-124,0,-94);g.addColorStop(0,'#ff5a55');g.addColorStop(1,'#c31f2a');
  ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(255,200,190,.6)';ctx.lineWidth=1.4;ctx.stroke();
  // дисплей
  rr(-58,-119,34,18,3);ctx.fillStyle='#07252b';ctx.fill();
  ctx.strokeStyle='#4dffd8';ctx.lineWidth=1.4;ctx.beginPath();
  for(let i=0;i<=16;i++){const px=-56+i*2,py=-110+Math.sin(t*4+i*0.7)*4*(0.5+Math.max.apply(null,P.keyPress));if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
  ctx.stroke();
  // кнопки
  const LC=[null,[120,255,230],[255,222,100],[255,150,205]];
  for(let i=0;i<6;i++){
    const bx=-18+i*11,by=-117;
    rr(bx,by,9,10,2);
    const lc=P.leds[i]?LC[P.leds[i]]:null;
    ctx.fillStyle=lc?rgbs(lc,1):'#7a0f18';ctx.fill();
    if(lc){ctx.save();ctx.globalCompositeOperation='lighter';glow(bx+4.5,by+5,16,lc,0.55);ctx.restore();}
  }
  // ручки
  for(const kx of [50,60]){ell(kx,-109,5,5,'#2a1014');ctx.strokeStyle='#fff';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(kx,-109);ctx.lineTo(kx+Math.sin(kx+t*0.3)*3,-109-4);ctx.stroke();}
  // клавиши
  rr(-66,-94,132,32,3);ctx.fillStyle='#2a0b10';ctx.fill();
  const kw=130/14;
  for(let i=0;i<14;i++){
    const kx=-65+i*kw,pr=P.keyPress[i];
    ctx.fillStyle=pr>0.05?'rgb(255,'+(245-pr*45|0)+','+(225-pr*125|0)+')':'#fbfbf6';
    ctx.fillRect(kx+0.5,-93+pr*2,kw-1,30);
    if(pr>0.05){ctx.save();ctx.globalCompositeOperation='lighter';glow(kx+kw/2,-80,22,[255,210,110],0.5*pr);ctx.restore();}
  }
  ctx.fillStyle='#15181b';
  for(let i=0;i<13;i++){if(i%7===2||i%7===6)continue;const kx=-65+(i+1)*kw-3;ctx.fillRect(kx,-93,6,19-P.keyPress[i]*0);}
  ctx.restore();
}

function drawSmoke(t,lvl,flat){
  ctx.save();ctx.globalCompositeOperation='screen';
  for(const p of puffs){
    if(p.flat!==flat)continue;
    p.x+=p.vx*dtG;if(p.x>1.4)p.x=-0.4;if(p.x<-0.4)p.x=1.4;
    const yy=p.y+Math.sin(t*p.sp+p.ph)*0.03;
    const sz=W*p.s*1.5,sh=flat?sz*0.34:sz;
    ctx.globalAlpha=clamp((0.2+0.12*Math.sin(t*p.sp*2+p.ph))*p.a*(0.8+0.6*lvl),0,0.6);
    ctx.drawImage(SMOKES[p.k],p.x*W-sz/2,yy*H-sh/2,sz,sh);
  }
  ctx.restore();
}
function drawBeams(t,pulse,lvl){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<6;i++){
    const b=BEAMS[i];
    const vis=i<4?1:clamp((lvl-0.12*(i-3))*3,0,1);
    if(vis<=0.01){b.cur=null;continue;}
    const sx=b.sx*W,sy=-10;
    const base=Math.atan2(W*0.5-sx,H*0.55-sy);
    const a=base+Math.sin(t*b.sp+b.ph)*b.amp;
    const len=H*1.2,dx=Math.sin(a),dy=Math.cos(a);
    const ex=sx+dx*len,ey=sy+dy*len;
    const hw=b.hw*(1+pulse*0.2);
    const px=Math.cos(a),py=-Math.sin(a),wEnd=len*Math.tan(hw);
    const col=beamColor(t*0.22+b.ci);
    const al=(0.13+0.2*lvl+pulse*0.07)*vis;
    const g=ctx.createLinearGradient(sx,sy,ex,ey);
    g.addColorStop(0,rgba(col,al*1.7));g.addColorStop(0.55,rgba(col,al*0.7));g.addColorStop(1,rgba(col,0));
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex+px*wEnd,ey+py*wEnd);ctx.lineTo(ex-px*wEnd,ey-py*wEnd);ctx.closePath();ctx.fill();
    // пятно на сцене
    if(dy>0.08){
      const u=(L.floorMid-sy)/dy,fx=sx+dx*u,R=W*(0.17+0.03*pulse);
      ctx.save();ctx.translate(fx,L.floorMid);ctx.scale(1,0.26);
      const pg=ctx.createRadialGradient(0,0,0,0,0,R);
      pg.addColorStop(0,rgba(col,0.42*vis*(0.7+0.5*lvl)));pg.addColorStop(1,rgba(col,0));
      ctx.fillStyle=pg;ctx.beginPath();ctx.arc(0,0,R,0,TAU);ctx.fill();ctx.restore();
    }
    b.cur={sx,sy,dx,dy,hw,col,vis};
  }
  ctx.restore();
}
function drawHalo(pulse,lvl){

function drawDust(t,lvl){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const d of dust){
    d.x+=d.vx*dtG;d.y+=d.vy*dtG;
    if(d.x<0)d.x=1;if(d.x>1)d.x=0;if(d.y<0)d.y=0.8;if(d.y>0.8)d.y=0;
    const px=d.x*W,py=d.y*H;
    let inBeam=0;
    for(let i=0;i<6;i++){
      const b=BEAMS[i].cur;if(!b)continue;
      const rx=px-b.sx,ry=py-b.sy,al=rx*b.dx+ry*b.dy;
      if(al<=0)continue;
      const perp=Math.abs(rx*b.dy-ry*b.dx);
      if(perp<al*Math.tan(b.hw)*0.95)inBeam=Math.max(inBeam,b.vis);
    }
    const tw=0.55+0.45*Math.sin(t*3+d.ph);
    const a=(inBeam?0.85:0.12)*tw;
    ctx.fillStyle='rgba(255,240,200,'+a+')';
    ctx.beginPath();ctx.arc(px,py,d.r*(inBeam?1.2:0.8),0,TAU);ctx.fill();
  }
  ctx.restore();
}
function drawFlares(t,lvl,pulse){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<6;i++){
    const b=BEAMS[i].cur;if(!b)continue;
    const x=b.sx,y=b.sy+14;
    glow(x,y,W*0.13*(1+pulse*0.2),b.col,0.5*b.vis);
    ctx.strokeStyle=rgba(b.col,0.35*b.vis);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(x-W*0.12,y);ctx.lineTo(x+W*0.12,y);ctx.stroke();
    if(i%2===0){
      const cx=W/2,cy=H*0.42;
      for(let j=1;j<=3;j++){
        const f=j*0.22,gx=lerp(x,cx,f+0.15),gy=lerp(y,cy,f+0.15),r=8+j*9;
        ctx.strokeStyle=rgba(b.col,0.16*b.vis);ctx.lineWidth=2;ctx.beginPath();ctx.arc(gx,gy,r,0,TAU);ctx.stroke();
        ctx.fillStyle=rgba(b.col,0.05*b.vis);ctx.beginPath();ctx.arc(gx,gy,r,0,TAU);ctx.fill();
      }
    }
  }
  // блик на контровом свете героини
  const hs=HERO.s;
  glow(HERO.x+14*hs,HERO.y-300*hs*0.82,70*hs+20,[255,240,200],0.22+0.15*lvl+pulse*0.08);
  ctx.restore();
}
function drawCrowd(t,pulse,lvl){
  const wk=clamp(W/390,0.8,1.4),E=crowdE;
  for(const p of crowd){
    const rw=CROWD_CFG[p.ri],sc=rw.sc*wk;
    const sway=Math.sin(t*1.5*p.sp+p.ph)*3.5*sc;
    const jump=Math.max(0,Math.sin(t*6.5*p.sp+p.ph))*E*7*sc;
    const x=p.x0+sway,r=11.5*sc*p.hs*(p.hair===3?1.1:1),hy=rw.y*H-pulse*2.2*sc-jump;
    ctx.fillStyle=rw.c;
    let hand=null;
    if(p.arm){
      const wv=Math.sin(t*3.2*p.sp+p.aph);
      const sx2=x+p.side*r*1.7,sy2=hy+r*2.1;
      const hxp=x+p.side*(r*2.2+wv*r*0.9),hyp=hy-r*(1.8+0.25*Math.cos(t*3.2*p.sp+p.aph));
      ctx.strokeStyle=rw.c;ctx.lineCap='round';ctx.lineWidth=r*0.85;
      ctx.beginPath();ctx.moveTo(sx2,sy2);ctx.quadraticCurveTo(x+p.side*r*2.7,hy+r*0.4,hxp,hyp);ctx.stroke();
      hand={x:hxp,y:hyp};
      ctx.beginPath();ctx.arc(hxp,hyp,r*0.55,0,TAU);ctx.fill();
    }
    // плечи
    ctx.beginPath();ctx.moveTo(x-r*2.3,H+20);ctx.lineTo(x-r*2.2,hy+r*2.7);
    ctx.quadraticCurveTo(x-r*1.9,hy+r*1.1,x,hy+r*1.0);ctx.quadraticCurveTo(x+r*1.9,hy+r*1.1,x+r*2.2,hy+r*2.7);
    ctx.lineTo(x+r*2.3,H+20);ctx.closePath();ctx.fill();
    // причёска и голова
    if(p.hair===1){ctx.beginPath();ctx.arc(x-p.side*r*0.95,hy-r*0.1,r*0.48,0,TAU);ctx.fill();}
    if(p.hair===2){ctx.beginPath();ctx.arc(x,hy-r*1.1,r*0.42,0,TAU);ctx.fill();}
    ctx.beginPath();ctx.arc(x,hy,r,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(140,245,235,'+(0.12+0.2*lvl)*(p.ri===2?0.6:1)+')';ctx.lineWidth=1.2*sc;
    ctx.beginPath();ctx.arc(x,hy,r,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
    if(hand&&p.phone){
      ctx.save();ctx.translate(hand.x,hand.y-r*0.5);ctx.rotate(p.side*0.15);
      ctx.fillStyle='#0b1418';rr(-r*0.32,-r*0.6,r*0.64,r*1.1,r*0.12);ctx.fill();
      const fl=0.75+0.25*Math.sin(t*9+p.fl);
      ctx.globalCompositeOperation='lighter';
      glow(0,-r*0.9,r*2.8,[255,244,214],0.5*fl*(0.55+0.35*lvl));
      ctx.fillStyle='rgba(255,250,235,'+(0.9*fl)+')';ctx.fillRect(-r*0.24,-r*0.52,r*0.48,r*0.22);
      ctx.restore();
    }
  }
  const cg=ctx.createLinearGradient(0,L.crowdTop-H*0.02,0,L.crowdTop+H*0.06);
  cg.addColorStop(0,'rgba(0,10,14,0)');cg.addColorStop(1,'rgba(0,10,14,.0)');
}

}
function drawRecords(){
  ctx.fillStyle='rgba(0,12,16,.62)';ctx.fillRect(0,0,W,H);
  uiLock=false;
  const pw=Math.min(W*0.84,330),ph=400,px=(W-pw)/2,py=Math.max(10,H*0.2);
  panel(px,py,pw,ph);
  goldText('Рекорды',W/2,py+46,40,0.5);
  MODES.forEach((m,i)=>{
    const y=py+96+i*58;
    rr(px+20,y,pw-40,48,14);ctx.fillStyle=(i===modeIdx)?'rgba(255,214,100,.2)':'rgba(255,255,255,.06)';ctx.fill();
    ctx.textBaseline='middle';ctx.textAlign='left';ctx.font='800 17px '+FONT;ctx.fillStyle='#e6fff9';ctx.fillText(m.name,px+34,y+24);
    ctx.textAlign='right';ctx.font='900 24px '+FONT;ctx.fillStyle='#ffd23f';ctx.fillText(records[m.id]>0?String(records[m.id]):'—',px+pw-34,y+24);
  });
  button('close',px+24,py+ph-70,pw-48,52,'Закрыть',{kind:'gold'});
}

/* =====================================================================
   ИГРА
   ===================================================================== */
function startGame(){
  initAudio();musicStart();
  G={mode:MODES[modeIdx].id,score:0,lives:3,combo:0,maxCombo:0,time:60,coins:[],spawn:0.2,elapsed:0,
    targetX:W/2,countdown:2.4,goT:0,newRecord:false,catches:0,shake:0,scorePop:0,overT:0};
  parts.length=0;floats.length=0;
  state='play';crowdE=0;
}
function updateRecord(){
  if(!G)return;
  if(G.score>records[G.mode]){records[G.mode]=G.score;G.newRecord=true;saveAll();}
}
function endGame(){
  if(!G||state==='over')return;
  state='over';G.overT=0;G.coins=[];
  updateRecord();
  tone(392,0.3,'triangle',0.12);tone(330,0.3,'triangle',0.12,0.25);tone(262,0.6,'triangle',0.12,0.5);
}
function exitToMenu(){
  if(G&&G.mode==='zen')updateRecord();
  G=null;state='menu';HERO.nextAct=2;
}
function spawnCoin(){
  const r=Math.random(),m=G.mode;let type='gold';
  if(m==='classic'||m==='minimal'){if(r<0.12)type='fake';else if(r<0.2)type='big';else if(r<0.235&&G.lives<5)type='heart';}
  else if(m==='timed'){if(r<0.14)type='fake';else if(r<0.26)type='big';}
  else{if(r<0.12)type='big';}
  const rad=type==='big'?30:(type==='heart'?16:22);
  const vs=H/700,zen=m==='zen'?0.8:1;
  const vy=(190+Math.min(260,G.score*0.35+G.elapsed*3.5)+rnd(0,50))*vs*zen*(type==='big'?1.15:1);
  G.coins.push({type,r:rad,x0:rnd(rad+10,W-rad-10),x:0,y:-rad*2,vy,spin:rnd(0,TAU),spinSp:rnd(3,7),ph:rnd(0,TAU),amp:rnd(0,12)});
}
function catchCoin(c){
  const hs=HERO;
  if(c.type==='fake'){
    G.combo=0;G.shake=1;buzz(80);
    tone(140,0.35,'sawtooth',0.12,0,60);
    spark(c.x,c.y,10,[255,90,110]);
    if(G.mode==='classic'||G.mode==='minimal'){G.lives--;floatText(c.x,c.y-20,'−жизнь',' #ff8a9a'.trim(),22);if(G.lives<=0)endGame();}
    else{G.score=Math.max(0,G.score-20);floatText(c.x,c.y-20,'−20','#ff8a9a',24);}
    return;
  }
  if(c.type==='heart'){
    G.lives=Math.min(5,G.lives+1);floatText(c.x,c.y-20,'+жизнь','#ff9cc4',22);
    spark(c.x,c.y,14,[255,120,170]);tone(660,0.15,'sine',0.12);tone(990,0.3,'sine',0.1,0.1);
    hs.catch=1;return;
  }
  G.combo++;G.catches++;if(G.combo>G.maxCombo)G.maxCombo=G.combo;
  const mult=Math.min(5,1+Math.floor(G.combo/5));
  const add=(c.type==='big'?30:10)*mult;
  G.score+=add;G.scorePop=1;hs.catch=1;
  floatText(c.x,c.y-24,'+'+add,c.type==='big'?'#fff0a0':'#ffe27a',c.type==='big'?30:24);
  spark(c.x,c.y,c.type==='big'?22:12);
  crowdE=Math.min(1.2,crowdE+0.2);
  tone(noteFreq(G.combo%14+2),0.22,'sine',0.13);tone(noteFreq(G.combo%14+2)*2,0.16,'triangle',0.05);
  if(G.combo%5===0){
    floatText(W/2,H*0.3,'КОМБО ×'+Math.min(5,1+Math.floor(G.combo/5)),'#ffb3d6',30);
    tone(880,0.12,'square',0.05);tone(1175,0.2,'square',0.05,0.1);crowdE=1.2;
  }
}
function missCoin(c){
  if(c.type==='gold'||c.type==='big'){
    G.combo=0;floatText(c.x,HERO.y-30,'мимо','#c9d8dc',16);
    tone(300,0.25,'sine',0.08,0,150);
    if(G.mode==='classic'||G.mode==='minimal'){G.lives--;buzz(60);G.shake=0.5;if(G.lives<=0)endGame();}
  }
}
function updatePlay(dt){
  const hs=HERO;
  const nx=clamp(G.targetX,W*0.07,W*0.93),old=hs.x;
  hs.x+=(nx-hs.x)*Math.min(1,dt*12);
  const v=(hs.x-old)/Math.max(dt,0.001);
  hs.lean+=(clamp(v*0.00022,-0.1,0.1)-hs.lean)*Math.min(1,dt*10);
  if(G.countdown>0){G.countdown-=dt;if(G.countdown<=0)G.goT=0.7;return;}
  if(G.goT>0)G.goT-=dt;
  G.elapsed+=dt;
  if(G.mode==='timed'){G.time-=dt;if(G.time<=0){G.time=0;endGame();return;}}
  G.spawn-=dt;
  if(G.spawn<=0){spawnCoin();G.spawn=Math.max(0.34,0.9-G.score/1800-G.elapsed*0.004)*rnd(0.7,1.25);}
  const catchHalf=Math.max(46,100*hs.s),top=hs.y-275*hs.s,bot=hs.y-85*hs.s;
  for(let i=G.coins.length-1;i>=0&&state==='play';i--){
    const c=G.coins[i];
    c.y+=c.vy*dt;c.x=c.x0+Math.sin(c.y*0.02+c.ph)*c.amp;c.spin+=c.spinSp*dt;
    if(c.y>top&&c.y<bot+c.r&&Math.abs(c.x-hs.x)<catchHalf+c.r*0.4){G.coins.splice(i,1);catchCoin(c);continue;}
    if(c.y>hs.y+4){G.coins.splice(i,1);missCoin(c);}
  }
}
function drawCoins(t){
  if(!G)return;
  for(const c of G.coins)drawCoin(c.x,c.y,c.r,c.spin,c.type);
}

/* =====================================================================
   ГЛАВНЫЙ ЦИКЛ
   ===================================================================== */
function update(dt,t){
  tNow=t;
  lightTarget=G?(0.12+0.88*clamp(G.score/450,0,1)):0.35;
  lightLevel+=(lightTarget-lightLevel)*Math.min(1,dt*1.5);
  crowdE=Math.max(0,crowdE-dt*0.45);
  if(G&&G.combo>=10)crowdE=Math.max(crowdE,0.35);
  if(state==='play'&&G)updatePlay(dt);
  if(state==='over'&&G)G.overT+=dt;
  updateHero(dt,t);
  updateParts(dt);
  if(G){G.shake=Math.max(0,G.shake-dt*2.5);G.scorePop=Math.max(0,G.scorePop-dt*4);}
}
function frame(ms){
  const t=ms/1000;
  dtG=Math.min(0.05,Math.max(0.001,t-(frame.last||t)));frame.last=t;
  update(dtG,t);
  ui=[];
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;
  const beat=(t*2)%1,pulse=Math.pow(1-beat,3),lvl=lightLevel;
  ctx.save();
  if(G&&G.shake>0)ctx.translate(rnd(-1,1)*G.shake*6,rnd(-1,1)*G.shake*6);
  const mini=!!(G&&G.mode==='minimal');
  if(mini){
    drawMinimal();drawHero(HERO,t,pulse);drawCoins(t);drawParts();
  }else{
  drawBackground(lvl);
  drawSmoke(t,lvl,false);
  drawBeams(t,pulse,lvl);
  drawHalo(pulse,lvl);
  drawFloor(t,lvl,pulse);
  const sp=synthPos();
  drawSynth(sp.x,sp.y,sp.s,HERO.synthA,t,HERO);
  drawHero(HERO,t,pulse);
  drawSmoke(t,lvl,true);
  drawCoins(t);
  drawCrowd(t,pulse,lvl);
  drawFlares(t,lvl,pulse);
  drawDust(t,lvl);
  drawParts();
  }
  // общая яркость и виньетка
  if(!mini){
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(190,255,240,'+(0.05*lvl)+')';ctx.fillRect(0,0,W,H);ctx.restore();
  const vg=ctx.createRadialGradient(W/2,H*0.5,H*0.3,W/2,H*0.5,H*0.85);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,10,14,'+(0.55-0.2*lvl)+')');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  }
  ctx.restore();

  uiLock=(state==='pause'||state==='over'||state==='records');
  if(state==='menu'||state==='records'){
    drawMenuUI(t,pulse);
    iconButton('sound',W-54,14,40,soundGlyph);
  }else if(G){
    drawHUD(t);
  }
  if(state==='pause')drawPause();
  else if(state==='over'&&G)drawOver(t);
  else if(state==='records')drawRecords();
  requestAnimationFrame(frame);
}

/* ---------- ввод ---------- */
function ptr(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)};
}
function hit(p){
  for(let i=ui.length-1;i>=0;i--){const b=ui[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)return b;}
  return null;
}
function onButton(id){
  initAudio();
  switch(id){
    case 'play':case 'again':startGame();break;
    case 'mode':modeIdx=(modeIdx+1)%MODES.length;saveAll();tone(520+modeIdx*140,0.14,'triangle',0.1);break;
    case 'rec':state='records';tone(660,0.12,'triangle',0.08);break;
    case 'close':state='menu';break;
    case 'pause':if(state==='play'){state='pause';}break;
    case 'resume':state='play';break;
    case 'menu':exitToMenu();break;
    case 'sound':soundOn=!soundOn;saveAll();if(soundOn)tone(660,0.12,'triangle',0.1);break;
  }
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();
  const p=ptr(e),b=hit(p);
  pressedId=b?b.id:null;
  if(state==='play'&&G&&!b)G.targetX=p.x;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  e.preventDefault();
  if(state==='play'&&G&&e.buttons!==0&&pressedId===null)G.targetX=ptr(e).x;
  else if(state==='play'&&G&&e.pointerType==='touch'&&pressedId===null)G.targetX=ptr(e).x;
});
cv.addEventListener('pointerup',e=>{
  e.preventDefault();
  const b=hit(ptr(e));
  if(b&&b.id===pressedId)onButton(b.id);
  pressedId=null;
});
cv.addEventListener('pointercancel',()=>{pressedId=null;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  if(state==='play'&&G){
    if(e.key==='ArrowLeft')G.targetX=HERO.x-70;
    if(e.key==='ArrowRight')G.targetX=HERO.x+70;
  }
  if((e.key==='Enter'||e.key===' ')&&state==='menu')startGame();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')state='pause';});
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));

resize();
requestAnimationFrame(frame);
})();
</script>
